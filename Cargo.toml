[package]
name = "rs-nanogpt"
version = "0.1.0"
edition = "2024"

# `crates/flash-attn` is a path dependency, so cargo would make it a member
# implicitly; declaring it keeps `default-members` explicit — a bare
# `cargo build`/`test` stays on the root package and never invokes nvcc.
[workspace]
members = ["crates/flash-attn"]
default-members = ["."]

[dependencies]
arrow-array = "58.1.0"
base64 = "0.22.1"
# Pinned to the commit the NCCL/cudarc API facts in
# writeups/multi-gpu-ddp-plan.md were verified against; a lockfile-only pin
# would not survive `cargo update`.
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "39355c6c9187747e360a2d6ec9d67a2a501b2552", version = "0.10.2" }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "39355c6c9187747e360a2d6ec9d67a2a501b2552", version = "0.10.2" }
clap = { version = "4.6.1", features = ["derive"] }
fancy-regex = "0.18.0"
# zstd covers the ClimbMix shards; snap covers the HF-native SFT parquet
# (smoltalk/mmlu/gsm8k all ship snappy-compressed).
parquet = { version = "58.1.0", default-features = false, features = ["arrow", "snap", "zstd"] }
rand = "0.10.1"
rand_chacha = "0.10.0"
rayon = "1.12.0"
# Vendored FlashAttention-2 (crates/flash-attn), forward + backward, trimmed to
# the one configuration d24 runs (head_dim 128, bf16). Optional and CUDA-only:
# building it runs nvcc over 5 translation units against CUTLASS, so it must
# never be pulled into a CPU or Metal build.
rs-flash-attn = { path = "crates/flash-attn", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
ureq = "3.3.0"

[dev-dependencies]
# Field/Fields, needed only to declare the list<struct> smoltalk fixture
# column in test_support; arrow-array already pulls the crate in.
arrow-schema = "58.1.0"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# Multi-GPU DDP over NCCL (one process per GPU). CUDA-only; needs libnccl on
# the box at build and run time.
nccl = ["cuda", "candle-core/nccl"]
# Fused FlashAttention-2 kernels. CUDA-only and slow to build; set
# CANDLE_FLASH_ATTN_BUILD_DIR to cache libflashattention.a between builds.
flash-attn = ["cuda", "dep:rs-flash-attn"]
