# Vendored copy of candle's `candle-flash-attn` (see README.md for provenance).
# Renamed so it can never be confused with the upstream crate, and pointed at
# the same pinned candle rev the root crate uses so both resolve to one
# `candle-core` — two instances would make the tensor types incompatible.
[package]
name = "rs-flash-attn"
version = "0.1.0"
edition = "2021"
description = "Vendored FlashAttention-2 layer for rs-nanogpt (fork of candle-flash-attn)."
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
candle = { git = "https://github.com/huggingface/candle.git", rev = "39355c6c9187747e360a2d6ec9d67a2a501b2552", version = "0.10.2", features = ["cuda"], package = "candle-core" }
half = { version = "2.3.1", features = ["num-traits"] }

[build-dependencies]
cudaforge = "0.1.2"
anyhow = { version = "1", features = ["backtrace"] }

[dev-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "39355c6c9187747e360a2d6ec9d67a2a501b2552", version = "0.10.2", features = ["cuda"] }
